name: Wiki

on:
  pull_request:
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  push:
    branches: [ main ]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate data-driven docs
        run: npm run docs:generate

      - name: Verify generated docs are committed
        run: git diff --exit-code docs/heroes-database.md docs/equipment-database.md

      - name: Build wiki
        run: npm run docs:build
